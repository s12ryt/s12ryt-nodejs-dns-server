services:
  s12-dns-server:
    build: .
    image: s12ryt/s12ryt-nodejs-dns-server:0.2.0
    user: "10001:10001"
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - s12-data:/app/data
    ports:
      - "5354:5354/udp"
      - "5354:5354/tcp"
      - "8053:8053/tcp"
      - "8080:8080/tcp"
      - "8081:8081/tcp"
      - "127.0.0.1:9090:9090/tcp"

volumes:
  s12-data:
